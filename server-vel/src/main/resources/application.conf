ktor {
    deployment {
        port = 8443
        port = ${?PORT}
        sslPort = 8443
    }
    application {
        modules = [ com.vel.server.ApplicationKt.module ]
    }
    security {
        ssl {
            keyStore = ${?VEL_KEYSTORE_PATH}
            keyAlias = ${?VEL_KEYSTORE_ALIAS}
            keyStorePassword = ${?VEL_KEYSTORE_PASSWORD}
            privateKeyPassword = ${?VEL_KEY_PASSWORD}
        }
    }
}
